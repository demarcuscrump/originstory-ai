<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1a1a1a" />
    
    <!-- SEO & Social Sharing -->
    <title>Origin Story | Create Your Legend</title>
    <meta name="description" content="A text-based comic book life simulation. Balance civilian life with superhero duties in a living, breathing city." />
    
    <!-- Google Fonts: Bangers (Headers) and Comic Neue (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'comic-yellow': '#F9F871',
              'comic-red': '#FF6B6B',
              'comic-blue': '#4D96FF',
              'comic-black': '#1a1a1a',
              'paper': '#ffffff',
            },
            fontFamily: {
              sans: ['"Comic Neue"', 'cursive', 'sans-serif'],
              display: ['"Bangers"', 'cursive'],
              comic: ['"Comic Neue"', 'cursive', 'sans-serif'], 
            },
            boxShadow: {
              'comic': '4px 4px 0px 0px #000000',
              'comic-lg': '8px 8px 0px 0px #000000',
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-in-out',
              'fade-in-up': 'fadeInUp 0.5s ease-out',
              'float': 'float 8s ease-in-out infinite',
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-8px)' },
              }
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
